services:
  timecapsule-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timecapsule-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - CAPSULE_AES_KEY=${CAPSULE_AES_KEY:?Задайте CAPSULE_AES_KEY (./generate-aes-key.sh)}
      - GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

